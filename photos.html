<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos | CHARLY.</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">CHARLY.</div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="photos.html" class="active">PHOTOS</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
        </nav>
    </header>

    <main class="photos-section" style="margin-top: 100px; padding: 0 5%; flex-grow: 1;">
        <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 500;">Selected Works.</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">A collection of my photographic work.</p>
        
        <!-- Filtros de categorías -->
        <div class="gallery-filters" style="display: flex; gap: 1rem; margin-bottom: 3rem; flex-wrap: wrap;">
            <button style="background: none; color: var(--text-main); border: 1px solid var(--text-main); padding: 0.5rem 1.5rem; cursor: pointer; border-radius: 20px;">ALL</button>
            <button style="background: none; color: var(--text-muted); border: 1px solid #333; padding: 0.5rem 1.5rem; cursor: pointer; border-radius: 20px;">FASHION</button>
            <button style="background: none; color: var(--text-muted); border: 1px solid #333; padding: 0.5rem 1.5rem; cursor: pointer; border-radius: 20px;">PORTRAITS</button>
            <button style="background: none; color: var(--text-muted); border: 1px solid #333; padding: 0.5rem 1.5rem; cursor: pointer; border-radius: 20px;">CONCEPTUAL</button>
            <button style="background: none; color: var(--text-muted); border: 1px solid #333; padding: 0.5rem 1.5rem; cursor: pointer; border-radius: 20px;">GASTRONOMY</button>
        </div>

        <!-- Cuadrícula base (Placeholders) -->
        <div class="gallery-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; margin-bottom: 4rem;">
            <div class="photo-item" style="aspect-ratio: 4/5; background: #111; border: 1px dashed #333; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">PHOTO 01</div>
            <div class="photo-item" style="aspect-ratio: 3/4; background: #111; border: 1px dashed #333; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">PHOTO 02</div>
            <div class="photo-item" style="aspect-ratio: 1/1; background: #111; border: 1px dashed #333; display: flex; align-items: center; justify-content: center; color: var(--text-muted);">PHOTO 03</div>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 CHARLY. All rights reserved.</p>
        <div class="social-links">
            <a href="#">Instagram</a>
            <a href="#">Email</a>
        </div>
    </footer>
</body>
</html>
